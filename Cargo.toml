[workspace]

resolver = "2"         # modern feature resolver; always set this
members = ["crates/*"]


[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
yaml_serde = "0.10.7"
validator = { version = "0.21.0", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"                    # prefer explicit error handling over .unwrap()
expect_used = "warn"
